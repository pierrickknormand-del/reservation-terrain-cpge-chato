<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation Terrain - CPGE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-6">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
    <h1 class="text-2xl font-bold mb-2">Réservation du terrain sportif</h1>
    <p class="text-slate-500 mb-6">Classes Préparatoires — Année 2026/2027</p>

    <form id="bookingForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Date</label>
        <input type="date" id="date" min="2026-09-01" max="2027-06-30" required class="w-full border rounded-lg p-2.5">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Créneau horaire</label>
        <select id="slot" required class="w-full border rounded-lg p-2.5 bg-white">
          <option value="15:00 - 16:30">15:00 - 16:30</option>
          <option value="16:30 - 18:00">16:30 - 18:00</option>
          <option value="18:30 - 20:00">18:30 - 20:00</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Prénom</label>
          <input type="text" id="firstName" required class="w-full border rounded-lg p-2.5">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Nom</label>
          <input type="text" id="lastName" required class="w-full border rounded-lg p-2.5">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Email institutionnel</label>
        <input type="email" id="email" required placeholder="nom@lycee.fr" class="w-full border rounded-lg p-2.5">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Filière</label>
        <select id="track" required class="w-full border rounded-lg p-2.5 bg-white">
          <optgroup label="Scientifiques">
            <option>MPSI</option><option>MP2I</option><option>PCSI</option><option>PTSI</option><option>BCPST</option>
          </optgroup>
          <optgroup label="Économiques">
            <option>ECG</option><option>ECT</option>
          </optgroup>
          <optgroup label="Littéraires">
            <option>A/L</option><option>B/L</option><option>Chartes</option>
          </optgroup>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Activité</label>
        <input type="text" id="activity" required placeholder="Football, basket..." class="w-full border rounded-lg p-2.5">
      </div>

      <button type="submit" class="w-full bg-slate-900 text-white font-medium py-3 rounded-lg hover:bg-slate-800 transition">
        Confirmer la réservation
      </button>
    </form>
  </div>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const d = new Date(document.getElementById('date').value);
      if (d.getDay() === 0 || d.getDay() === 6) {
        alert("Erreur : le terrain est fermé le week-end.");
        return;
      }
      alert("Réservation confirmée pour " + document.getElementById('firstName').value + " !");
    });
  </script>
</body>
</html>
